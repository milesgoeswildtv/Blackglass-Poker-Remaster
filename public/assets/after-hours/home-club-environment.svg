<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Underground private poker room">
<defs>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#090907"/><stop offset=".48" stop-color="#17110d"/><stop offset="1" stop-color="#070604"/></linearGradient>
 <radialGradient id="amber"><stop stop-color="#f3bd68" stop-opacity=".72"/><stop offset=".28" stop-color="#b96c32" stop-opacity=".28"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
 <radialGradient id="felt"><stop stop-color="#1a513d"/><stop offset=".58" stop-color="#0d3427"/><stop offset="1" stop-color="#061b15"/></radialGradient>
 <linearGradient id="wood" x2="0" y2="1"><stop stop-color="#684027"/><stop offset=".28" stop-color="#342016"/><stop offset=".7" stop-color="#1a100c"/><stop offset="1" stop-color="#0b0806"/></linearGradient>
 <linearGradient id="brass"><stop stop-color="#5b3b1d"/><stop offset=".28" stop-color="#c08b45"/><stop offset=".48" stop-color="#6b431f"/><stop offset=".72" stop-color="#d0a15a"/><stop offset="1" stop-color="#4a2d18"/></linearGradient>
 <pattern id="panels" width="310" height="220" patternUnits="userSpaceOnUse"><rect width="310" height="220" fill="none" stroke="#513925" stroke-opacity=".22" stroke-width="3"/><path d="M18 18h274v184H18z" fill="none" stroke="#1f1711" stroke-width="2"/></pattern>
 <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="7"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .08"/></feComponentTransfer></filter>
 <filter id="shadow"><feGaussianBlur in="SourceAlpha" stdDeviation="12"/><feOffset dy="12"/><feComponentTransfer><feFuncA type="linear" slope=".65"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="1000" fill="url(#wall)"/>
<rect width="1600" height="590" fill="url(#panels)"/>
<path d="M0 570h1600" stroke="#6b472b" stroke-opacity=".4" stroke-width="6"/>
<path d="M0 582h1600" stroke="#0a0806" stroke-width="16"/>
<!-- framed back-room window -->
<g filter="url(#shadow)"><rect x="1015" y="74" width="420" height="392" rx="8" fill="#070706" stroke="url(#brass)" stroke-width="10"/><rect x="1041" y="100" width="368" height="340" fill="#0b100d" stroke="#2e2117" stroke-width="4"/><path d="M1225 100v340M1041 270h368" stroke="#553923" stroke-width="5"/></g>
<!-- practical pendant and warm pool -->
<circle cx="1245" cy="250" r="365" fill="url(#amber)"/>
<path d="M1245 0v136" stroke="#5c402a" stroke-width="8"/>
<path d="M1173 137h144l45 92h-234z" fill="#5d3b27" stroke="url(#brass)" stroke-width="5"/>
<ellipse cx="1245" cy="255" rx="275" ry="230" fill="url(#amber)" filter="url(#blur)"/>
<!-- leather banquette / shelving -->
<g filter="url(#shadow)"><path d="M54 604h462v225H54z" fill="#17100c" stroke="#4d301d" stroke-width="9"/><path d="M80 625h410v165H80z" fill="#25160f"/><path d="M80 675h410M80 730h410" stroke="#0c0907" stroke-width="12"/><path d="M115 625v165M230 625v165M345 625v165M460 625v165" stroke="#4c2c1c" stroke-opacity=".55" stroke-width="4"/></g>
<!-- main poker table -->
<g filter="url(#shadow)"><path d="M602 620c254-94 622-68 833 60 105 64 145 156 83 232-87 107-345 145-610 108-273-38-456-133-444-242 7-69 53-122 138-158z" fill="url(#wood)" stroke="#25140d" stroke-width="18"/><path d="M637 651c236-74 561-48 742 57 85 50 113 115 65 168-70 77-283 102-498 71-226-32-376-99-365-175 7-51 25-91 56-121z" fill="url(#felt)" stroke="url(#brass)" stroke-width="8"/><path d="M670 675c213-58 500-34 659 58 67 39 88 86 53 125-60 65-247 83-431 57-194-27-326-81-318-141 5-38 17-70 37-99z" fill="none" stroke="#d0a15a" stroke-opacity=".12" stroke-width="3"/></g>
<ellipse cx="1060" cy="812" rx="230" ry="88" fill="#efb85d" opacity=".06"/>
<!-- chairs -->
<g fill="#15100d" stroke="#5d3b25" stroke-width="7" filter="url(#shadow)"><path d="M508 548q94-106 188 0v176H508z"/><path d="M1364 530q90-98 180 0v194h-180z"/></g>
<!-- sideboard decanter / framed detail -->
<g opacity=".88"><rect x="142" y="484" width="84" height="104" rx="7" fill="#120e0b" stroke="url(#brass)" stroke-width="4"/><path d="M164 552h40l-4-42h-32z" fill="#6f3e22" stroke="#c08a4a" stroke-width="2"/><path d="M175 496h18v16h-18z" fill="#3a2418"/></g>
<!-- tiny chip stacks, no text/state -->
<g opacity=".58" stroke="#b88849" stroke-width="2"><ellipse cx="1000" cy="750" rx="25" ry="8" fill="#2a1510"/><ellipse cx="1000" cy="741" rx="25" ry="8" fill="#492118"/><ellipse cx="1050" cy="770" rx="22" ry="7" fill="#152d25"/><ellipse cx="1050" cy="762" rx="22" ry="7" fill="#1d4737"/></g>
<rect width="1600" height="1000" filter="url(#grain)" opacity=".42"/>
<rect width="1600" height="1000" fill="none" stroke="#000" stroke-opacity=".5" stroke-width="74"/>
</svg>