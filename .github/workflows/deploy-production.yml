name: Deploy Crashout Poker Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crashout-poker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, build, and deploy production Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v6

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build production assets
        run: npm run build

      - name: Validate Worker configuration
        run: npm run check:worker

      - name: Deploy Worker to Cloudflare production
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
