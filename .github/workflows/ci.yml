name: Poker CI

on:
  push:
    branches: [main, visual-remaster]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      BLACKGLASS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BLACKGLASS_SOURCE_REF: ${{ github.head_ref || github.ref }}
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BLACKGLASS_SOURCE_SHA }}
      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Production dependency audit
        run: npm run audit:prod
      - name: Full dependency audit
        run: npm run audit:all
      - name: Run tests
        run: npm test
      - name: Build application
        run: npm run build
      - name: Validate Cloudflare Worker package
        run: npm run check:worker
      - name: Stamp BLACKGLASS build provenance
        if: github.ref == 'refs/heads/visual-remaster' || github.event_name == 'pull_request'
        run: |
          printf '%s\n' "$BLACKGLASS_SOURCE_SHA" > dist/BLACKGLASS_BUILD_SHA.txt
          printf '%s\n' "$BLACKGLASS_SOURCE_REF" > dist/BLACKGLASS_BUILD_REF.txt
          printf '%s\n' "$GITHUB_RUN_ID" > dist/BLACKGLASS_BUILD_RUN_ID.txt
      - name: Upload exact BLACKGLASS build artifact
        if: github.ref == 'refs/heads/visual-remaster' || github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: crashout-poker-dist-${{ env.BLACKGLASS_SOURCE_SHA }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Install Chromium for BLACKGLASS browser QA
        if: github.ref == 'refs/heads/visual-remaster' || github.event_name == 'pull_request'
        run: npx playwright install --with-deps chromium
      - name: Run BLACKGLASS Home/Lobby browser QA
        if: github.ref == 'refs/heads/visual-remaster' || github.event_name == 'pull_request'
        run: npm run qa:home
      - name: Run BLACKGLASS internal Home browser QA
        if: github.ref == 'refs/heads/visual-remaster' || github.event_name == 'pull_request'
        run: npm run qa:home-internal
      - name: Resolve prior gameplay geometry baseline
        if: github.ref == 'refs/heads/visual-remaster' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${PRIOR_SHA}&status=completed&per_page=20" --jq '.workflow_runs | map(select(.name == "Poker CI" and .conclusion == "success")) | .[0].id // empty')"
          if [ -n "$run_id" ]; then
            artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" --jq '.artifacts | map(select(.name | startswith("blackglass-gameplay-runtime-"))) | .[0].id // empty')"
            if [ -n "$artifact_id" ]; then
              mkdir -p artifacts/gameplay-baseline /tmp/blackglass-gameplay-baseline
              gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/blackglass-gameplay-baseline.zip
              unzip -q /tmp/blackglass-gameplay-baseline.zip -d /tmp/blackglass-gameplay-baseline
              geometry="$(find /tmp/blackglass-gameplay-baseline -name geometry.json -print -quit)"
              if [ -n "$geometry" ]; then cp "$geometry" artifacts/gameplay-baseline/geometry.json; fi
            fi
          fi
      - name: Run BLACKGLASS gameplay browser QA
        if: github.ref == 'refs/heads/visual-remaster' || github.event_name == 'pull_request'
        run: npm run qa:gameplay
      - name: Upload BLACKGLASS gameplay browser evidence
        if: always() && (github.ref == 'refs/heads/visual-remaster' || github.event_name == 'pull_request')
        uses: actions/upload-artifact@v4
        with:
          name: blackglass-gameplay-runtime-${{ env.BLACKGLASS_SOURCE_SHA }}
          path: artifacts/browser-qa-gameplay/
          if-no-files-found: error
          retention-days: 14
      - name: Upload BLACKGLASS internal browser evidence
        if: always() && (github.ref == 'refs/heads/visual-remaster' || github.event_name == 'pull_request')
        uses: actions/upload-artifact@v4
        with:
          name: blackglass-home-internal-runtime-${{ env.BLACKGLASS_SOURCE_SHA }}
          path: artifacts/browser-qa-internal/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload BLACKGLASS browser evidence
        if: always() && (github.ref == 'refs/heads/visual-remaster' || github.event_name == 'pull_request')
        uses: actions/upload-artifact@v4
        with:
          name: blackglass-home-runtime-${{ env.BLACKGLASS_SOURCE_SHA }}
          path: artifacts/browser-qa/
          if-no-files-found: warn
          retention-days: 14
