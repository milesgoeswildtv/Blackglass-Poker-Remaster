name: Inspect Poker gameplay artwork
on:
  push:
    branches:
      - qa/inspect-approved-gameplay-assets
permissions:
  contents: read
  actions: write
jobs:
  package-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Package candidate backgrounds and references
        run: |
          mkdir -p /tmp/asset-inspection
          cp public/remaster/afterhours_reference_gameplay_desktop.png /tmp/asset-inspection/
          cp public/remaster/afterhours_reference_gameplay_mobile.png /tmp/asset-inspection/
          cp public/remaster/afterhours_gameplay_background_desktop.png /tmp/asset-inspection/
          cp public/remaster/afterhours_gameplay_background_mobile.png /tmp/asset-inspection/
          cp public/remaster/afterhours_reference_home_entry.png /tmp/asset-inspection/
          cp public/assets/remaster/CRASHOUT_BACKGROUND_REMASTER.webp /tmp/asset-inspection/
          cp public/assets/remaster/CRASHOUT_TABLE_REMASTER.webp /tmp/asset-inspection/
          sha256sum /tmp/asset-inspection/* > /tmp/asset-inspection/SHA256SUMS.txt
      - name: Upload inspection bundle
        uses: actions/upload-artifact@v4
        with:
          name: poker-gameplay-asset-inspection
          path: /tmp/asset-inspection/
          retention-days: 3
