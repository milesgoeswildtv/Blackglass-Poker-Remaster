# one-time bootstrap v2
name: Bootstrap Blackglass Baseline

on:
  push:
    branches: [main]
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  mirror:
    if: >
      (github.event_name == 'push' && github.event.head_commit.message == 'BOOTSTRAP BLACKGLASS MIRROR') ||
      (github.event_name == 'issues' && github.event.issue.title == 'BOOTSTRAP BLACKGLASS MIRROR')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Materialize pinned Crashout Poker source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="eb8eae11121bf4f2b7eef0cf82022039bc9118ca"
          rm -rf /tmp/crashout-poker-source
          git init /tmp/crashout-poker-source
          git -C /tmp/crashout-poker-source remote add origin https://github.com/milesgoeswildtv/FULL-TILT-POKER-SITE.git
          git -C /tmp/crashout-poker-source fetch --depth=1 origin "$SOURCE_SHA"
          git -C /tmp/crashout-poker-source checkout --detach FETCH_HEAD
          git -C /tmp/crashout-poker-source lfs install --local || true
          git -C /tmp/crashout-poker-source lfs pull || true

          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github/workflows' \
            /tmp/crashout-poker-source/ ./

          git config user.name "Blackglass Baseline Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No baseline changes detected."
            exit 0
          fi

          git commit -m "BLACKGLASS BASELINE — Crashout Poker pre-remaster snapshot" \
            -m "Source: milesgoeswildtv/FULL-TILT-POKER-SITE@${SOURCE_SHA}" \
            -m "Product identity remains CRASHOUT POKER. Blackglass is internal codename only."
          git tag -a blackglass-baseline-pre-remaster -m "Crashout Poker visual-remaster baseline from ${SOURCE_SHA}"
          git push origin HEAD:main
          git push origin blackglass-baseline-pre-remaster
