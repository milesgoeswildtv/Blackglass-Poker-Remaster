<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0C0B09" />
  <title>Crashout Poker</title>
  <link rel="preload" href="/fonts/source-sans-3-roman-400-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/archivo-narrow-700.woff2" as="font" type="font/woff2" crossorigin>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <style>
    .globalLegal{display:none;position:relative;z-index:20;width:min(1040px,calc(100% - 32px));margin:-10px auto 28px;padding:18px 4px 0;border-top:1px solid var(--cp-divider);font:500 12px/1.5 var(--cp-font-ui);color:var(--cp-text-muted);text-align:center}
    .globalLegal.isHome{display:block}.globalLegal strong{color:var(--cp-text-secondary);font-family:var(--cp-font-display);font-weight:700;letter-spacing:.12em}.globalLegal p{margin:4px 0 10px}.globalLegal div{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 14px}.globalLegal a{color:var(--cp-text-secondary,#C6BBA6);text-decoration:none}.globalLegal a:hover{text-decoration:underline}.globalLegal a:focus-visible{outline:2px solid var(--cp-accent-focus);outline-offset:2px}
    @media(max-width:760px){.globalLegal{width:calc(100% - 18px);margin:-8px auto 20px;font-size:12px}}
  </style>
</head>
<body>
  <div id="root"></div>
  <nav id="globalLegal" class="globalLegal" aria-label="Crashout Poker policies">
    <strong>CRASHOUT POKER</strong>
    <p>Private play-chip poker • Optional cosmetic digital items only • No cash-out or monetary prizes</p>
    <div>
      <a href="/terms.html">Terms of Service</a>
      <a href="/purchases.html">Cosmetic Purchases</a>
      <a href="/refunds.html">Refund Policy</a>
      <a href="/privacy.html">Privacy Policy</a>
      <a href="/contact.html">Contact &amp; Support</a>
    </div>
  </nav>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    (()=>{const root=document.getElementById('root'),legal=document.getElementById('globalLegal');const sync=()=>legal.classList.toggle('isHome',!!root.querySelector('.homeShell'));new MutationObserver(sync).observe(root,{childList:true,subtree:true});sync()})();
  </script>
</body>
</html>
